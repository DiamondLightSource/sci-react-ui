name: OSV Scanner

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV Scanner (human-readable)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |
            --lockfile=pnpm-lock.yaml

      - name: Run OSV Scanner (JSON)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |
            --format=json
            --output-file=results.json
            --lockfile=pnpm-lock.yaml

      - name: Fail on CRITICAL vulnerabilities only
        run: |
          if jq -e '
            .results[].packages[].vulnerabilities[]?
            | select((.database_specific.severity // "") == "CRITICAL")
          ' results.json > /dev/null; then
            echo "❌ Critical vulnerabilities found"
            exit 1
          else
            echo "✅ No critical vulnerabilities"
          fi
