# This workflow will publish an rc package tagged with "next" to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Next (rc) Package

on:
  push:
    tags:
      - 'v*-rc*'


jobs:
  publish-npm:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # Required for OIDC
      contents: read

    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
          registry-url: https://registry.npmjs.org/
          scope: '@diamondlightsource'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Publish
        run: pnpm stage publish -r --no-git-checks --access public --tag next
